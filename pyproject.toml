[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "svmforge"
version = "0.1.0"
description = "World-class kernel methods & SVM system: pure-numpy SMO/LS-SVM offline core, sklearn SOTA backend, KernelFuse adaptive multi-kernel fusion. Author: 晨星"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.16.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -W ignore::UserWarning"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
